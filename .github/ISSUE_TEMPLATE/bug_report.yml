name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    attributes:
      label: App version
      placeholder: 1.3.1
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version
      placeholder: Windows 10 22H2 or Windows 11
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs
      description: Remove email addresses, cookies, tokens, and personal data before posting.
